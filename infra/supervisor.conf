[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Laravel Horizon (gerencia todas as filas Redis) ────────────────────────────
[program:vivensi-horizon]
process_name=%(program_name)s
command=php /var/www/vivensi/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vivensi-horizon.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=3600
stopsignal=SIGTERM

; ── Laravel Scheduler (substitui cron para ambientes sem crontab acessível) ───
; Prefira usar cron real — ver infra/deploy.sh para o comando crontab.
; Só ative este bloco se não conseguir configurar cron na máquina.
;[program:vivensi-scheduler]
;process_name=%(program_name)s
;command=/bin/bash -c "while true; do php /var/www/vivensi/artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"
;autostart=true
;autorestart=true
;user=www-data
;redirect_stderr=true
;stdout_logfile=/dev/null
