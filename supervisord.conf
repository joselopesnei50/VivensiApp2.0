[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Queue worker principal (2 processos)
[program:vivensi-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/vivensi/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vivensi-worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

; ── Queue worker WhatsApp (1 processo dedicado)
[program:vivensi-worker-whatsapp]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/vivensi/artisan queue:work database --queue=whatsapp --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vivensi-worker-whatsapp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

; ── Scheduler Laravel (loop de 60s)
[program:vivensi-scheduler]
command=bash -c "while true; do php /var/www/vivensi/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vivensi-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
