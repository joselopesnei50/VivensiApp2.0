# Vivensi — configuração do gitleaks (detecção de segredos em Git)
# Docs: https://github.com/gitleaks/gitleaks#configuration
#
# Ativação:
#   - CI: job `gitleaks` em .github/workflows/laravel.yml (automático em push/PR)
#   - Local (opcional): git config core.hooksPath .githooks

title = "Vivensi gitleaks config"

[extend]
# Herda o ruleset padrão do gitleaks (AWS, GCP, Slack, GitHub, Stripe, etc)
useDefault = true

# ── Allowlist global (aplica a TODAS as regras) ──────────────────────────────
[allowlist]
description = "Falsos positivos conhecidos e credenciais já rotacionadas"

# Valores literais que podem aparecer em qualquer arquivo/commit sem alerta.
# Uso: strings que já foram rotacionadas em produção e ficam no histórico
# como fantasmas — não abrem mais nada, não devem gerar ruído em scans --all.
regexes = [
    # EVOLUTION_GLOBAL_KEY antiga (rotacionada, comprovadamente inerte via HTTP 401)
    '''e838f5d5b86ea0fe27492c283c27498ffe0b250085896f1eaa8093baf0a3309e''',
    # DB_PASSWORD antiga do MySQL (rotacionada, rejeitada pelo mysql client)
    '''Viv3nsi@2026''',
    # AUTHENTICATION_API_KEY antiga da Evolution (rotacionada, HTTP 401)
    '''SenhaForteVivensi2026@!''',
    # WEBHOOK_HMAC_KEY hardcoded histórica (AbacatePayService.php:21 em commit a7f83cf)
    # — nunca configurada em prod (nem .env nem SystemSetting retornam valor)
    '''t9dXRhHHo3yDEj5pVDYz0frf7q6bMKyMRmxx''',
    # EVOLUTION_GLOBAL_KEY histórica adicional (EvolutionApiService.php em commit fee52ce)
    # — inertização confirmada por teste HTTP 401 na Evolution API
    '''4f2a7b9c1d8e5f3a6b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a''',
    # META_WEBHOOK_VERIFY_TOKEN histórico (WhatsappController.php em commit c3a21cf)
    # — token só usado no handshake inicial de setup do webhook Meta
    '''vivensi_seguro_2026''',
    # Placeholders públicos do soketi/pusher em dev local
    '''vivensi-key''',
    '''vivensi-secret''',
    # Placeholders de documentação Evolution API
    '''evolution-api\.seuservidor\.com''',
    '''SUA_API_KEY''',
]

# Paths ignorados globalmente (regex sobre o caminho do arquivo)
paths = [
    '''^\.env$''',
    '''\.env\.example$''',
    '''\.env\.backup$''',
    '''\.gitleaks\.toml$''',
    '''\.gitleaks-report\.json$''',
    '''vendor/''',
    '''node_modules/''',
    '''storage/''',
    '''public/build/''',
    # Testes e fixtures — senhas fake documentadas
    '''tests/.*\.php$''',
    '''database/factories/''',
    '''database/seeders/''',
    # Docs internos (auditorias, planos, análises) — sem segredos ativos
    '''docs/AUDIT_.*\.md$''',
    '''docs/VPS_ANALISE_.*\.md$''',
    '''docs/PLANO_.*\.md$''',
    '''docs/GITLEAKS_SETUP\.md$''',
    # Arquivos ignorados pelo próprio git (defesa em profundidade)
    '''^report\.md$''',
    '''^resultado.*\.md$''',
    '''^relatorio.*\.md$''',
    '''^seguranca.*\.md$''',
    '''^teste.*\.md$''',
    '''^analise.*\.md$''',
    '''^auditoria.*\.md$''',
    '''^erro.*\.md$''',
    # Docs de auditoria antigos com strings sensíveis (referências históricas)
    '''^AUDIT_SUMMARY\.md$''',
    '''^CORRECTION_PLAN\.md$''',
    '''^SESSION_LOG\.md$''',
    '''^evolution_api_fix\.md$''',
]

# ── Regras específicas com allowlist próprio ─────────────────────────────────
# LinkedIn Client ID triggera em strings "linkedin_..." em blades/php (nomes
# de canais social, não de client_id real). Ignoramos ocorrências no view layer.
[[rules]]
id = "linkedin-client-id"
[rules.allowlist]
paths = [
    '''resources/views/''',
    '''app/Http/Controllers/''',
    '''app/Models/''',
]

# GA4 measurement ID é nome de campo em SystemSetting, não credencial.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
regexes = [
    '''ga4_measurement_id''',
    '''ga4_tracking_id''',
]

# Commits específicos que sabemos conter segredos já rotacionados.
# Adicione novos SHAs aqui quando fizer sentido silenciar histórico.
commits = [
    # Deixe vazio ou adicione SHAs pontuais. Regexes acima já pegam a maioria.
]
