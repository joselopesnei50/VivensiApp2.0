server {
    listen 80;
    server_name evo.vivensi.app.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name evo.vivensi.app.br;

    ssl_certificate /etc/letsencrypt/live/evo.vivensi.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evo.vivensi.app.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://evolution_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}
